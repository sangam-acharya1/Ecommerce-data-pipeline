version: 2

models:
  - name: dim_seller
    description: >
      Seller dimension table containing seller performance metrics,
      revenue ranking, and delivery reliability classification.

    columns:
      - name: seller_id
        description: Unique identifier for each seller.
        tests:
          - not_null
          - unique

      - name: total_orders
        description: Total number of orders fulfilled by the seller.

      - name: total_revenue
        description: Total revenue generated by the seller.

      - name: avg_delivery_days
        description: Average number of days taken to deliver orders.

      - name: late_delivery_rate
        description: Percentage of the seller's orders that were delivered late.

      - name: revenue_rank
        description: Seller's ranking based on total revenue, where 1 indicates the highest revenue.

      - name: delivery_reliability
        description: >
          Delivery reliability category derived from the seller's late delivery rate.
        tests:
          - accepted_values:
              values:
                - perfect
                - reliable
                - unreliable
                - poor