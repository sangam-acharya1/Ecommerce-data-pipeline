version: 2

models:
  - name: stg_orders
    description: "Cleaned and renamed orders from Spark gold layer"
    columns:
      - name: order_id
        description: "Primary key - unique per order"
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 
                       'invoiced', 'processing', 'unavailable',
                       'created', 'approved']

      - name: order_status_detailed
        tests:
          - accepted_values:
              values: ['delivered_on_time', 'delivered_late',
                       'canceled', 'shipped', 'processing',
                       'invoiced', 'unavailable', 'created', 'approved']

      - name: revenue_band
        tests:
          - accepted_values:
              values: ['low', 'medium', 'high']

      - name: total_order_value
        tests:
          - not_null

      - name: order_date
        tests:
          - not_null